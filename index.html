<title>VerbMaster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{--g:#2F7D5B;--gd:#1F5C42;--soft:#F1F7F3;--line:#E3ECE6;--line2:#D5E2DA;--ink:#1C2B24;--mute:#5C6B63;--grey:#F1F3F2;--bad:#A3392F;--badbg:#FBEFED}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif;font-size:16px;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,p{margin:0}
#app{max-width:440px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
#view{flex:1;padding:8px 24px 24px;display:flex;flex-direction:column;gap:14px}
#view.full{padding:8px 20px 12px;gap:10px}
#view.full>.grow{display:none}
html.lock,html.lock body{height:100%;overflow:hidden;overscroll-behavior:none}
html.lock #app{position:fixed;left:0;right:0;top:var(--vvt,0px);height:var(--vvh,100dvh);min-height:0}
html.lock #view{overflow-y:auto;-webkit-overflow-scrolling:touch}
#kbkeep{position:fixed;top:0;left:0;width:1px;height:1px;padding:0;border:0;opacity:0;font-size:16px;pointer-events:none}
.full .q{padding-top:2px;gap:4px}.full .q h1{font-size:32px;margin-top:4px;line-height:1.15}.full .q h1.long{font-size:22px}
.full .chip{padding:4px 12px;font-size:12px}
.full .field{min-height:54px}.full .field span,.full .field input{font-size:20px}
.full .keys{grid-template-columns:repeat(10,minmax(0,1fr));gap:4px}.full .keys button{height:42px;font-size:16px;padding:0;border-radius:8px}
.full.answered .keys{display:none}
.full .fb{padding:8px 14px}.full .fb .link{min-height:28px;margin-top:2px}.full .btn.big{min-height:50px}
.full .timer{font-size:28px;margin:0;text-align:left}
.chstat{font-size:13px;color:var(--mute);margin-left:10px;white-space:nowrap}.chstat b{font:700 17px 'Space Grotesk',sans-serif;color:var(--ink)}
.full .lbl{margin-top:0}.full .sentence{padding:6px 0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.grow{flex:1;min-width:0}.tc{text-align:center}
.muted{color:var(--mute);font-size:14px}.strong{font-weight:600;font-size:16px}.accent{color:var(--gd);font-weight:500;font-size:14px;margin:6px 0}
h1,.brand,.bignum,.timer,.stats b,.dot.num{font-family:'Space Grotesk',Inter,sans-serif}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:16px}
.head h1{font-size:26px;font-weight:700}.brand span{color:var(--g)}
.lang select{height:44px;padding:0 12px;border:1px solid var(--line2);border-radius:22px;background:#fff;font-weight:500;font-size:14px}
.seg{display:flex;gap:4px;padding:4px;background:var(--soft);border-radius:14px}
.seg button{flex:1;min-width:0;height:44px;padding:0 4px;border:0;border-radius:10px;background:transparent;color:var(--mute);font-weight:500;font-size:15px}
.seg button[aria-selected=true]{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(28,43,36,.08)}
.sub{font-size:13px;font-weight:500;color:var(--mute);margin-top:4px}
.list{display:flex;flex-direction:column;gap:10px}
.card{border:1px solid var(--line);border-radius:16px;background:#fff;padding:14px 16px}
.card h2{font-size:16px;font-weight:600}
.lvl{display:flex;align-items:center;gap:14px;width:100%;text-align:left;min-height:64px}
.lvl b{display:block;font-weight:600}.lvl small{font-size:13px;color:var(--mute)}
.lvl.off b{font-weight:500;color:var(--mute)}
.set .bar{display:block;margin-top:8px;background:var(--soft)}.q h1.long{font-size:24px;line-height:1.25}
.act{background:var(--soft);border:1.5px solid var(--g);padding:18px 16px 16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:14px}
.dot{width:36px;height:36px;flex:none;border-radius:50%;background:var(--grey);color:#6B7872;display:flex;align-items:center;justify-content:center}
.dot.ok{background:var(--g);color:#fff}
.dot.num{background:#fff;border:1.5px solid var(--g);color:var(--g);font-weight:700;font-size:15px}
.dot.xl{width:72px;height:72px}.dot.xl svg{width:32px;height:32px}
.bar{height:8px;background:#fff;border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--g);border-radius:4px;transition:width .3s}
.top .bar,.trow .bar,.bar.thin{background:var(--soft)}.bar.thin{height:6px}
.trow.off .bar{background:var(--grey)}
.btn{min-height:48px;padding:0 18px;border:0;border-radius:12px;background:var(--g);color:#fff;font-weight:600;font-size:16px}
.btn.big{min-height:56px;border-radius:16px;font-size:17px;width:100%}
.btn.ghost{background:transparent;color:var(--g)}
.btn:disabled{background:var(--line2);color:#fff;cursor:default}
.hint{font-size:13px;color:var(--mute);text-align:center;padding:4px 8px}
.icon{width:44px;height:44px;border:0;background:transparent;color:var(--mute);display:flex;align-items:center;justify-content:center;border-radius:12px}
.top{display:flex;align-items:center;gap:12px}.top .icon{margin-left:-10px}
.q{display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:20px;text-align:center}
.q h1{font-size:40px;font-weight:700;margin-top:10px;overflow-wrap:anywhere}.q p{color:var(--mute)}
.chip{display:inline-block;padding:6px 14px;background:var(--soft);border-radius:16px;font-size:13px;font-weight:600;color:var(--g)}
.lbl{font-size:14px;font-weight:500;color:var(--mute);margin-top:10px}
.field{display:flex;align-items:center;gap:12px;min-height:64px;padding:0 18px;border:1.5px solid var(--g);border-radius:16px}
.field span{font-size:21px;font-weight:500;color:var(--mute);white-space:nowrap}
.field input{flex:1;min-width:0;height:44px;border:0;outline:0;background:transparent;font-size:21px;font-weight:600}
.field:focus-within{box-shadow:0 0 0 3px rgba(47,125,91,.18)}
.keys{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.keys button{height:44px;border:1px solid var(--line2);border-radius:10px;background:#fff;font-weight:500;font-size:17px}
.keys button:active{background:var(--soft)}
.fb{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border-radius:16px}
.fb b{display:block}.fb p{margin-top:2px}
.fb.good{background:var(--soft)}.fb.good b{color:var(--gd)}
.fb.bad{background:var(--badbg)}.fb.bad b{color:var(--bad)}
.fb input{width:100%;height:44px;margin:8px 0 0;padding:0 12px;border:1px solid var(--line2);border-radius:10px;background:#fff}
.link{min-height:44px;padding:0;border:0;background:transparent;color:var(--g);font-weight:600;font-size:14px}
.mini{font-size:14px;text-align:center}.mini.good{color:var(--gd)}.mini.bad{color:var(--bad)}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px 0}
.center h1{font-size:26px}.lead{font-size:16px;color:var(--ink);max-width:300px;line-height:1.45}
.bignum{font-size:28px;font-weight:700}.bignum.xl{font-size:72px;line-height:1;color:var(--g)}
.timer{font-size:60px;font-weight:700;line-height:1;color:var(--g);text-align:center;margin-top:8px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.stats div{padding:12px 16px;border:1px solid var(--line);border-radius:16px}
.stats small{display:block;font-size:13px;color:var(--mute)}.stats b{font-size:26px}
.stats em{font:500 14px Inter,sans-serif;color:var(--g)}
.ltitle{font-size:22px;line-height:1.25}
.row.sticky{position:sticky;top:0;background:#fff;padding:8px 0;z-index:2;gap:8px}.row.sticky .btn{padding:0 14px}
.lq{border:0;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}.lq legend{font-weight:600;font-size:16px;line-height:1.35;padding:0;margin-bottom:8px}
.lq button{min-height:48px;padding:10px 14px;text-align:left;border:1.5px solid var(--line2);border-radius:14px;background:#fff;font-size:15px;line-height:1.3}
.lq button.sel{border-color:var(--g);background:var(--soft);font-weight:600}
.lq button.yes{border-color:var(--g);background:var(--soft);color:var(--gd);font-weight:600}
.lq button.no{border-color:var(--bad);background:var(--badbg);color:var(--bad)}
details.card summary{min-height:44px;display:flex;align-items:center;font-weight:600;color:var(--g);cursor:pointer}details.card p{line-height:1.55;font-size:15px}
.playbtn{display:inline-flex;align-items:center;justify-content:center;gap:8px}
.lvl small{display:block}button.lvl:disabled{opacity:.5;cursor:default}
.field input::placeholder{color:#8A968F;font-weight:400;font-size:16px}
.grp{display:flex;align-items:baseline;justify-content:space-between;font-size:15px;font-weight:600;margin:14px 2px 0}.grp small{font-size:13px;font-weight:400;color:var(--mute)}
.gcard{display:flex;flex-direction:column;gap:10px}.gcard h3{margin:0;font-size:16px;font-weight:600;line-height:1.3}.gcard .bar{background:var(--soft)}
.btn.line{background:#fff;color:var(--g);border:1.5px solid var(--g);display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;box-sizing:border-box}
.opts button{height:auto;min-height:52px;padding:8px 6px;overflow-wrap:anywhere}
.opts.wide{grid-template-columns:1fr}.opts.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.sneak,.lvl small.sneak{color:var(--g);font-weight:600;font-size:13px}
.ask{background:var(--soft);border:1.5px solid var(--g);display:flex;flex-direction:column;gap:12px}
button.lvl.off{background:#fff}
.hero.col{flex-direction:column;text-align:center;gap:12px}
.board{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.board li{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 12px;border-bottom:1px solid var(--line);font-size:14px;color:var(--mute)}
.board li b{font:700 20px 'Space Grotesk',sans-serif;color:var(--ink);min-width:28px}
.board .rank{width:24px;font-weight:600}
.board li.me{background:var(--soft);border-radius:12px;border-bottom-color:transparent}.board li.me b{color:var(--g)}
.hero{display:flex;align-items:center;gap:20px;padding:20px;background:var(--soft);border-radius:20px}
.ring{position:relative;width:120px;height:120px;flex:none}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:700 26px 'Space Grotesk',sans-serif}
.block{display:flex;flex-direction:column;gap:12px;margin-top:8px}.block h2{font-size:15px;font-weight:600}
.trow{display:flex;flex-direction:column;gap:6px;font-size:14px}.trow>div:first-child{display:flex;justify-content:space-between}
.trow span:last-child{font-weight:600;color:var(--gd)}.trow.off,.trow.off span:last-child{color:var(--mute);font-weight:400}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chips span{padding:8px 14px;border:1px solid var(--line2);border-radius:18px;font-size:14px;font-weight:500}
.form{display:flex;flex-direction:column;gap:8px;padding:20px;border-radius:20px}
.form label{font-size:13px;font-weight:500;color:var(--mute);margin-top:6px}
.form input,.form select,.form textarea{width:100%;min-height:48px;padding:10px 14px;border:1px solid var(--line2);border-radius:12px;background:#fff}
.form input:focus,.form select:focus,.form textarea:focus,.lang select:focus,.fb input:focus{outline:2px solid var(--g);outline-offset:1px}
.form .btn{margin-top:10px}
.form code{display:block;padding:10px 12px;background:var(--soft);border-radius:10px;font-size:13px;overflow-wrap:anywhere}
.form details{margin-top:8px;font-size:14px}.form summary{min-height:44px;display:flex;align-items:center;color:var(--g);font-weight:600;cursor:pointer}
.form details p{color:var(--mute);line-height:1.45}
.prev{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 12px;padding:14px;background:var(--soft);border-radius:12px;font-size:14px;margin-top:6px}
.prev.warn,.note.warn{display:block;background:var(--badbg);color:var(--bad)}
.note{padding:12px 16px;background:var(--soft);border-radius:12px;font-size:14px;color:var(--gd);overflow-wrap:anywhere}
.vrow{display:flex;align-items:center;gap:12px;min-height:56px;border-bottom:1px solid var(--line)}
.vrow b{display:block;font-weight:500}.vrow small{font-size:13px;color:var(--mute)}
.intro{padding:14px 16px;background:var(--soft);border-radius:14px;font-size:14px;line-height:1.5}
.sentence{font-size:24px;font-weight:600;text-align:center;padding:12px 0;line-height:1.4}
mark{background:#DCEDE3;color:var(--gd);padding:2px 6px;border-radius:6px}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.opts button{height:52px;border:1.5px solid var(--line2);border-radius:14px;background:#fff;font-weight:600;font-size:18px;color:var(--ink)}
.opts button.yes{border-color:var(--g);background:var(--soft);color:var(--gd)}
.opts button.no{border-color:var(--bad);background:var(--badbg);color:var(--bad)}
#nav{position:sticky;bottom:0;display:flex;border-top:1px solid var(--line);padding:8px 8px calc(10px + env(safe-area-inset-bottom));background:#fff}
#nav[hidden]{display:none}
#nav button{flex:1;min-width:0;padding:0;min-height:52px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:500;color:var(--mute)}
#nav button.on{color:var(--g);font-weight:600}
button:focus-visible{outline:2px solid var(--g);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}

function level() { let n = 0; while (n < TENSES.length - 1 && sure(TENSES[n].k) >= GOAL) n++; return n; }
function markDay() {
  const d = new Date(), today = d.toISOString().slice(0, 10);
  if (S.day === today) return;
  const y = new Date(d.getTime() - 864e5).toISOString().slice(0, 10);
  S.days = S.day === y ? (S.days || 0) + 1 : 1; S.day = today;
}

/* --- Verb-Runde --- */
function makeQ(v, k) { const f = forms(v, k); const i = pick(persons(v, k)); return { v, k, i, f: f[i] }; }
function buildRound(k) {
  const b = S.box[k] || {};
  const vs = verbs().filter(v => persons(v, k).length);
  const review = shuffle(vs.filter(v => v.fr in b && b[v.fr] < 2));
  const hard = review.filter(v => S.err[v.fr] > 0), rest = review.filter(v => !(S.err[v.fr] > 0));
  const fresh = vs.filter(v => !(v.fr in b));
  let list = hard.concat(rest).slice(0, fresh.length ? 6 : ROUND);
  list = list.concat(fresh.slice(0, ROUND - list.length));
  if (list.length < ROUND) list = list.concat(shuffle(vs.filter(v => !list.includes(v))).slice(0, ROUND - list.length));
  return shuffle(list).map(v => makeQ(v, k));
}
function startRound(k, sneak) {
  X = { k, list: buildRound(k), n: 0, right: 0, done: false, lv: level(), sneak: !!sneak };
  go('ex');
}
function qCard(q, label, ask) {
  return `<div class="q"><span class="chip">${label}</span><h1>${esc(q.v.fr)}</h1><p>${esc(meaning(q.v))}</p></div>
    <label class="sr" for="ans">${ask}</label>
    <div class="field"><span>${esc(subject(q.i, q.k, q.f[0]))}</span><input id="ans" type="text" aria-label="${t('yourAnswer')}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
    <div class="keys">${KEYS.map(c => `<button type="button" data-a="key" data-c="${c}">${c}</button>`).join('')}</div>`;
}
function vExercise() {
  const q = X.list[X.n], idx = TENSES.indexOf(TMAP[q.k]);
  return `<header class="top"><button type="button" class="icon" data-a="quit" aria-label="${t('quit')}">${IC.x}</button>
    <div class="bar grow"><i style="width:${Math.round(100 * X.n / X.list.length)}%"></i></div><span class="muted">${X.n + 1} / ${X.list.length}</span></header>
    ${qCard(q, (X.sneak ? t('sneakRound') : t('level', { a: idx + 1 })) + ' · ' + TMAP[q.k].n, t('whichForm'))}
    <div id="fb" aria-live="polite"></div><div class="grow"></div>
    <button type="button" class="btn big" id="go" data-a="check">${t('check')}</button>`;
}
function phrase(i, k, form) { const s = subject(i, k, form); return s + (/'$/.test(s) ? '' : ' ') + form; }
function full(q) { return esc(phrase(q.i, q.k, q.f[0])); }
function record(q, ok) {
  const b = S.box[q.k] = S.box[q.k] || {};
  if (ok) { b[q.v.fr] = Math.min(3, (b[q.v.fr] || 0) + 1); if (S.err[q.v.fr] > 0) S.err[q.v.fr]--; }
  else { b[q.v.fr] = 0; S.err[q.v.fr] = (S.err[q.v.fr] || 0) + 1; }
  markDay(); save();
}
function checkAnswer() {
  if (X.done) return nextQ();
  const inp = $('#ans'), q = X.list[X.n];
  if (!inp.value.trim()) return inp.focus();
  const g = grade(inp.value, q.f), ok = g === 'ok';

    ? `<div class="fb good"><span class="dot ok">${IC.check}</span><div><b>${t('right')}</b><p>${full(q)}</p></div></div>`

/* --- Vokabeln --- */
function vocSets() {
  return [{ id: 'own', title: t('myWords'), items: S.vocab }].concat(VOCAB_SETS.map(s => ({ id: s.id, title: s.title, items: s.items.map(x => ({ fr: x[0], m: x[1] })) })));
}
const vocSure = set => set.items.filter(w => S.vbox[w.fr] >= 2).length;
const noArt = s => s.replace(/^(le |la |les |l'|un |une |des )/, '');
/** Alle akzeptierten Schreibweisen: ohne Artikel, ohne Klammerzusatz, einzelne Teile bei «/» oder Komma */
function vocVariants(fr) {
  const out = new Set(), add = x => { x = noArt(norm(x).replace(/[.!?…]+$/, '').trim()); if (x) out.add(x); };
  const base = norm(fr);
  for (const f of [base, base.replace(/\s*\([^)]*\)/g, ''), base.replace(/[()]/g, '')]) {
    add(f);
    f.split(/\s*\/\s*|,\s*/).forEach(p => { if (p.length > 1) add(p); });
    const m = f.match(/^(.+?),\s*(e|ne|le|se|te|ve|ère|euse|trice)$/);
    if (m) { add(m[1]); add(m[1] + m[2]); }
  }
  return out;
}
function vocStart(id) {
  const set = vocSets().find(s => s.id === id) || vocSets()[0], all = set.items;
  if (!all.length) { addMode = 'word'; return go('verbs'); }
  const seen = shuffle(all.filter(w => w.fr in S.vbox && S.vbox[w.fr] < 2)), fresh = all.filter(w => !(w.fr in S.vbox));
  let list = seen.slice(0, fresh.length ? 6 : ROUND).concat(fresh).slice(0, ROUND);
  if (list.length < ROUND) list = list.concat(shuffle(all.filter(w => !list.includes(w))).slice(0, ROUND - list.length));
  W = { set, list: shuffle(list), n: 0, right: 0, done: false };
  go('voc');
}
function vVoc() {
  const w = W.list[W.n];
  return `<header class="top"><button type="button" class="icon" data-a="vquit" aria-label="${t('quit')}">${IC.x}</button>
    <div class="bar grow"><i style="width:${Math.round(100 * W.n / W.list.length)}%"></i></div><span class="muted">${W.n + 1} / ${W.list.length}</span></header>
    <div class="q"><span class="chip">${esc(W.set.title)}</span><h1 class="${w.m.length > 28 ? 'long' : ''}">${esc(w.m)}</h1></div>
    <label class="sr" for="ans">${t('translate')}</label>
    <div class="field"><input id="ans" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
    <div class="keys">${KEYS.map(c => `<button type="button" data-a="key" data-c="${c}">${c}</button>`).join('')}</div>
    <div id="fb" aria-live="polite"></div><div class="grow"></div>
    <button type="button" class="btn big" id="go" data-a="vcheck">${t('check')}</button>`;
}
function vocCheck() {
  if (W.done) { W.n++; W.done = false; return W.n >= W.list.length ? go('vsum') : render(); }
  const inp = $('#ans'), w = W.list[W.n];
  if (!inp.value.trim()) return inp.focus();
  const a = noArt(norm(inp.value).replace(/[.!?…]+$/, '').trim()), acc = [...vocVariants(w.fr)], ok = acc.includes(a);
  W.done = true; inp.readOnly = true; $('#view').classList.add('answered');
  if (ok) { W.right++; S.vbox[w.fr] = Math.min(3, (S.vbox[w.fr] || 0) + 1); } else S.vbox[w.fr] = 0;
  markDay(); save();
  $('#fb').innerHTML = ok
    ? `<div class="fb good"><span class="dot ok">${IC.check}</span><div><b>${t('right')}</b><p>${esc(w.fr)}</p></div></div>`
    : `<div class="fb bad"><div><b>${acc.some(x => flat(x) === flat(a)) ? t('accent') : t('wrong')}</b><p>${t('solution')}: <strong>${esc(w.fr)}</strong></p></div></div>`;
  $('#go').textContent = t('next');
}
function vVocSum() {
  const set = vocSets().find(s => s.id === W.set.id) || W.set;
  return `<div class="center"><span class="dot ok xl">${IC.check}</span><h1>${t('roundDone')}</h1>
    <p class="bignum">${t('score', { a: W.right, b: W.list.length })}</p>
    <p class="muted">${esc(set.title)}: ${t('wSure', { a: vocSure(set), b: set.items.length })}</p>

/* --- Challenge --- */
function board(mark) {
  if (!S.scores.length) return `<p class="muted">${t('noScores')}</p>`;
  let used = false;
  return `<ol class="board">${S.scores.map((x, i) => {
    const me = !used && mark != null && x.s === mark.s && x.d === mark.d; if (me) used = true;
    let date = ''; try { if (x.d) date = new Date(x.d).toLocaleDateString(S.lang, { day: 'numeric', month: 'short', year: 'numeric' }); } catch (e) { date = ''; }
    return `<li class="${me ? 'me' : ''}"><span class="rank">${i + 1}</span><b>${x.s}</b><span class="grow">${t('points')}</span><small>${esc(date)}</small></li>`;
  }).join('')}</ol>`;
}
function vChallenge() {
  return `<header class="head"><h1>${t('challenge')}</h1>${S.sneaks > 0 ? `<b class="sneak">${t('sneaksN', { a: S.sneaks })}</b>` : ''}</header>
    <section class="hero col"><p class="lead">${t('chDesc')}</p>
    <button type="button" class="btn big" data-a="chstart">${t('chStart')}</button></section>
    <section class="block"><h2>${t('best')}</h2>${board(null)}<p class="hint">${t('sneakInfo')}</p></section>`;
}
function chQuestion() {
  const ks = TENSES.slice(0, level() + 1).map(T => T.k);
  const seen = new Set(); for (const k in S.box) for (const f in S.box[k]) seen.add(f);
  const all = verbs(); let pool = all.filter(v => v.custom || seen.has(v.fr));
  if (pool.length < 30) pool = pool.concat(BUILTIN.slice(0, 60));
  for (let n = 0; n < 50; n++) { const v = pick(pool), k = pick(ks); if (persons(v, k).length) return makeQ(v, k); }
  return makeQ(BUILTIN[0], 'pr');
}
function chStart() {
  if (C && C.timer) clearInterval(C.timer);
  C = { left: CH_SECONDS, score: 0, streak: 0, last: '', q: chQuestion(), timer: null };
  C.timer = setInterval(() => {
    C.left--;
    const el = $('#timer'); if (el) { el.textContent = clock(C.left); $('#tbar').style.width = (100 * C.left / CH_SECONDS) + '%'; }
    if (C.left <= 0) chEnd();
  }, 1000);
  go('chrun');
}
const clock = s => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
function vChRun() {
  return `<header class="top"><button type="button" class="icon" data-a="chquit" aria-label="${t('quit')}">${IC.x}</button>
    <div class="timer" id="timer">${clock(C.left)}</div><span class="grow"></span>
    <span class="chstat">${t('points')} <b>${C.score}</b></span><span class="chstat">${t('streak')} <b>${C.streak}</b></span></header>
    <div class="bar thin"><i id="tbar" style="width:${100 * C.left / CH_SECONDS}%"></i></div>
    ${qCard(C.q, TMAP[C.q.k].n, t('fast'))}
    <div id="fb" aria-live="polite">${C.last}</div>
    <button type="button" class="btn big" data-a="chcheck">${t('check')}</button>`;
}
function chCheck() {
  const inp = $('#ans'); if (!inp.value.trim()) return inp.focus();
  const ok = grade(inp.value, C.q.f) === 'ok';
  if (ok) { C.score++; C.streak++; C.last = `<p class="mini good">${t('right')}: ${full(C.q)}</p>`; }
  else { C.streak = 0; C.last = `<p class="mini bad">${t('solution')}: <strong>${full(C.q)}</strong></p>`; }
  markDay(); C.q = chQuestion(); render();
}
function chEnd() {
  clearInterval(C.timer); C.timer = null;

  msg = `<p class="note">${t('bulkRes', { a: ok, b: skip.length })}${skip.length ? ' ' + t('skipped') + ' ' + esc(skip.join(', ')) : ''}</p>`;
  render();
}

/* --- Grammatik --- */
/* Aufgabenarten: neue Art = neuer Eintrag mit html(item). Geprüft wird immer gegen item.a. */
const GRAM_TYPES = {
  choice: item => `<div class="opts${(item.options || PRONOUNS).some(o => o.length > 16) ? ' wide' : (item.options || PRONOUNS).some(o => o.length > 9) || (item.options || PRONOUNS).length === 2 || (item.options || PRONOUNS).length === 4 ? ' two' : ''}">${(item.options || PRONOUNS).map(o => `<button type="button" data-a="gopt" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>`,
  input: () => `<div class="field"><input id="ans" type="text" aria-label="${t('yourAnswer')}" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
    <div class="keys">${KEYS.map(c => `<button type="button" data-a="key" data-c="${c}">${c}</button>`).join('')}</div>`
};
function gStart(id) {
  const mod = GRAMMAR.find(m => m.id === id), done = S.gram[id] || {};
  const order = shuffle(mod.items.map((_, i) => i)).sort((a, b) => (done[a] ? 1 : 0) - (done[b] ? 1 : 0));
  G = { mod, order, n: 0, right: 0, done: false };
  go('gram');
}
function vGram() {
  const item = G.mod.items[G.order[G.n]];
  const sent = esc(item.s).replace(/\[([^\]]*)\]/g, '<mark>$1</mark>');
  return `<header class="top"><button type="button" class="icon" data-a="gquit" aria-label="${t('quit')}">${IC.x}</button>
    <div class="bar grow"><i style="width:${Math.round(100 * G.n / G.order.length)}%"></i></div><span class="muted">${G.n + 1} / ${G.order.length}</span></header>
    <div class="q"><span class="chip">${esc(L(G.mod.title))}</span></div>
    ${G.n === 0 ? `<p class="intro">${esc(L(G.mod.intro))}</p>` : ''}
    <p class="lbl">${esc(L(G.mod.task))}</p><p class="sentence">${sent}</p>
    ${(GRAM_TYPES[item.type] || GRAM_TYPES.choice)(item)}
    <div id="fb" aria-live="polite"></div><div class="grow"></div>
    <button type="button" class="btn big" id="go" data-a="gnext"${item.type === 'input' ? '' : ' disabled'}>${item.type === 'input' ? t('check') : t('next')}</button>`;
}
function gAnswer(value, btn) {
  if (G.done) return;
  const idx = G.order[G.n], item = G.mod.items[idx];
  const ok = [].concat(item.a).map(norm).includes(norm(value));
  G.done = true; if (ok) { G.right++; (S.gram[G.mod.id] = S.gram[G.mod.id] || {})[idx] = 1; }
  markDay(); save();
  document.querySelectorAll('.opts button').forEach(b => {
    b.disabled = true;
    if ([].concat(item.a).includes(b.dataset.v)) b.classList.add('yes'); else if (b === btn) b.classList.add('no');
  });
  $('#fb').innerHTML = `<div class="fb ${ok ? 'good' : 'bad'}"><div><b>${ok ? t('right') : t('wrong')}</b><p><strong>${esc(item.r)}</strong></p>${item.tag ? `<p class="muted">${esc(item.tag)}</p>` : ''}</div></div>`;
  const goBtn = $('#go'); goBtn.disabled = false; goBtn.textContent = t('next');
}
function gNext() {
  if (!G.done) { const inp = $('#ans'); if (inp && inp.value.trim()) { inp.readOnly = true; gAnswer(inp.value); } else if (inp) inp.focus(); return; }
  G.n++; G.done = false;
  if (G.n >= G.order.length) return go('gsum');
  render();
}
function vGramSum() {
  return `<div class="center"><span class="dot ok xl">${IC.check}</span><h1>${esc(L(G.mod.title))}</h1>
    <p class="bignum">${t('score', { a: G.right, b: G.order.length })}</p>
    <button type="button" class="btn big" data-a="gstart" data-id="${G.mod.id}">${t('again')}</button>
    <button type="button" class="btn ghost" data-a="nav" data-n="learn">${t('overview')}</button></div>`;
}

/* ---------- Ereignisse ---------- */
const ACT = {
  nav: el => { if (C && C.timer) { clearInterval(C.timer); C.timer = null; } hush(); go(el.dataset.n); },
  tab: el => go('learn', { tab: el.dataset.n }),
  sneakask: el => go('learn', { ask: el.dataset.k }),
  sneakno: () => go('learn'),
  sneakgo: el => { if (!(S.sneaks > 0)) return go('learn'); S.sneaks--; save(); startRound(el.dataset.k, true); },
  start: el => startRound(el.dataset.k),
  quit: () => go('learn'),
  check: checkAnswer,
  key: el => {
    const inp = $('#ans'); if (!inp || inp.readOnly) return;
    const a = inp.selectionStart ?? inp.value.length, b = inp.selectionEnd ?? a;
    inp.value = inp.value.slice(0, a) + el.dataset.c + inp.value.slice(b);
    inp.focus(); inp.setSelectionRange(a + 1, a + 1);
  },
  fix: () => {
    const q = X.list[X.n];
    $('#fb').innerHTML = `<div class="fb bad"><div class="grow"><label for="fixin"><b>${t('fix')}</b></label>
      <input id="fixin" type="text" value="${esc(q.f[0])}" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button type="button" class="link" data-a="fixsave">${t('saveFix')}</button></div></div>`;
    $('#fixin').focus();
  },
  fixsave: () => {
    const q = X.list[X.n], val = $('#fixin').value.trim(); if (!val) return;
    S.ov[q.v.fr + '|' + q.k + '|' + q.i] = norm(val); save();
    $('#fb').innerHTML = `<div class="fb good"><div><b>${t('fixed')}</b><p>${esc(norm(val))}</p></div></div>`;
  },
  chstart: chStart,
  chcheck: chCheck,
  chquit: () => { clearInterval(C.timer); C.timer = null; go('challenge'); },
  bulk: bulkImport,
  copy: el => {
    const done = () => { el.textContent = t('copied'); };
    try { navigator.clipboard.writeText($('#aitext').textContent).then(done, () => {}); } catch (e) { /* Text bleibt zum Markieren sichtbar */ }
  },
  del: el => { S.custom.splice(+el.dataset.i, 1); _verbs = null; save(); render(); },
  bexport: () => {
    try {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([backupText()], { type: 'application/json' }));
      a.download = 'verbmaster-sicherung-' + new Date().toISOString().slice(0, 10) + '.json';
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    } catch (e) { ACT.bcopy($('[data-a=bcopy]')); }
  },
  bcopy: el => {
    const txt = backupText(), box = $('#btext');
    const fallback = () => { box.value = txt; box.focus(); box.select(); };
    try { navigator.clipboard.writeText(txt).then(() => { el.textContent = t('copied'); }, fallback); } catch (e) { fallback(); }
  },
  bcheck: backupCheck,
  bapply: () => {
    if (!pendingBackup) return;
    S = pendingBackup.state; pendingBackup = null; _verbs = null; save();
    _bmsg = `<p class="note">${t('importOk')}</p>`; render();
  },
  gstart: el => gStart(el.dataset.id),
  gopt: el => gAnswer(el.dataset.v, el),
  gnext: gNext,
  gquit: () => go('learn', { tab: 'gram' }),
  ltopen: el => ltOpen(el.dataset.id),
  ltplay: () => sayLong(TX.tx.text),
  ltslow: () => sayLong(TX.tx.text, true),
  ltstop: hush,
  ltquit: () => { hush(); go('listen'); },
  ltpick: el => {
    if (TX.done) return;
    TX.pick[+el.dataset.q] = +el.dataset.o;
    el.parentElement.querySelectorAll('button').forEach(b => b.classList.toggle('sel', b === el));
    $('#lres').innerHTML = '';
  },
  lteval: ltEval,
  lstart: el => lStart(el.dataset.id),
  lplay: () => { say(H.list[H.n].say); const i = $('#ans'); if (i && !i.readOnly) i.focus({ preventScroll: true }); },
  lslow: () => { say(H.list[H.n].say, true); const i = $('#ans'); if (i && !i.readOnly) i.focus({ preventScroll: true }); },
  lcheck: lCheck,
  lquit: () => { try { if (speechOK) speechSynthesis.cancel(); } catch (e) { /* egal */ } go('listen'); },
  vstart: el => vocStart(el.dataset.id),
  vcheck: vocCheck,
  vquit: () => go('learn', { tab: 'vocab' }),
  addwords: () => { addMode = 'word'; go('verbs'); },
  addmode: el => { addMode = el.dataset.n; render(); },
  wdel: el => { const w = S.vocab.splice(+el.dataset.i, 1)[0]; if (w) delete S.vbox[w.fr]; save(); render(); }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el || el.disabled) return;
  const f = ACT[el.dataset.a]; if (f) f(el);
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (e.target.id === 'ans') { e.preventDefault(); V.name === 'chrun' ? chCheck() : V.name === 'gram' ? gNext() : V.name === 'voc' ? vocCheck() : V.name === 'lrun' ? lCheck() : checkAnswer(); }
  else if (e.target.id === 'fixin') { e.preventDefault(); ACT.fixsave(); }
});
document.addEventListener('submit', e => { e.preventDefault(); if (e.target.id === 'addform') submitVerb(); else if (e.target.id === 'wordform') submitWord(); });
document.addEventListener('input', e => { if (e.target.dataset.i === 'prev') preview(); });
document.addEventListener('change', e => {
  if (e.target.dataset.c === 'lang') { S.lang = e.target.value; save(); render(); }
  else if (e.target.dataset.c === 'prev') preview();
  else if (e.target.dataset.c === 'bfile' && e.target.files[0]) {
    const fr = new FileReader();
    fr.onload = () => { $('#btext').value = String(fr.result); backupCheck(); };
    fr.readAsText(e.target.files[0]);
  }
});

render();

</script>
</body>
</html>
